<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nightreign bosses weakness</title>
  <!-- Fonts are the only external dependency; page works fully offline if fonts cached -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet" />
  <style>
    /* ─── CSS Variables ─────────────────────────────────────── */
    :root {
      --bg:       #0b0c10;
      --surface:  #111318;
      --surface2: #181b22;
      --border:   #2a2d38;
      --accent:   #c9a96e;
      --accent2:  #7b9fc7;
      --text:     #d8d0c4;
      --muted:    #6e7280;
      --glow:     rgba(201,169,110,0.15);
      /* height of the sticky header bar – used to offset scroll */
      --header-h: 0px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Crimson Pro', serif;
      font-size: 15px;
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 40% at 50% -5%, rgba(201,169,110,0.06) 0%, transparent 60%),
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.012) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.012) 40px);
    }

    /* ─── Site header ────────────────────────────────────────── */
    header {
      padding: 2rem 1.5rem 1.2rem;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(201,169,110,0.04) 0%, transparent 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }
    header h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.2rem, 3vw, 2.2rem);
      color: var(--accent);
      letter-spacing: 0.06em;
      text-shadow: 0 0 40px rgba(201,169,110,0.3);
    }
    header p { color: var(--muted); font-style: italic; font-size: 0.95rem; }

    .header-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    /* ─── Nav Tabs ───────────────────────────────────────────── */
    .tabs { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .tab-btn {
      padding: 0.48rem 1.2rem;
      background: transparent; border: none;
      color: var(--muted);
      font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.09em;
      cursor: pointer; border-right: 1px solid var(--border); transition: all 0.18s;
      text-transform: uppercase; white-space: nowrap;
    }
    .tab-btn:last-child { border-right: none; }
    .tab-btn.active    { background: var(--glow); color: var(--accent); }
    .tab-btn:hover:not(.active) { color: var(--text); background: rgba(255,255,255,0.03); }

    /* ─── Global view toggle ─────────────────────────────────── */
    .seg-wrap { display: flex; align-items: center; gap: 0.55rem; }
    .seg-label { font-family: 'Cinzel', serif; font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
    .segmented { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .seg-btn {
      padding: 0.38rem 0.85rem;
      background: transparent; border: none;
      color: var(--muted); font-family: 'Cinzel', serif; font-size: 0.65rem; letter-spacing: 0.08em;
      text-transform: uppercase; cursor: pointer; border-right: 1px solid var(--border); transition: all 0.18s; white-space: nowrap;
    }
    .seg-btn:last-child { border-right: none; }
    .seg-btn.active { background: var(--glow); color: var(--accent); }
    .seg-btn:hover:not(.active) { color: var(--text); background: rgba(255,255,255,0.03); }

    /* ─── Main content ───────────────────────────────────────── */
    main { max-width: 1400px; margin: 0 auto; padding: 1.8rem 1rem 4rem; }

    .panel { display: none; animation: fadeIn 0.22s ease; }
    .panel.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

    .empty-state { text-align: center; padding: 3.5rem 2rem; color: var(--muted); font-style: italic; }
    .empty-state .icon { font-size: 2.4rem; margin-bottom: 0.9rem; opacity: 0.4; }

    /* ─── Expedition buttons ─────────────────────────────────── */
    .exp-btn-section { margin-bottom: 1.3rem; }
    .exp-btn-label { font-family: 'Cinzel', serif; font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.6rem; }
    .exp-btn-grid { display: flex; flex-wrap: wrap; gap: 0.45rem; }
    .exp-btn {
      padding: 0.42rem 0.85rem;
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.05em;
      text-transform: capitalize; cursor: pointer; transition: all 0.16s; white-space: nowrap;
    }
    .exp-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--glow); }
    .exp-btn.active { background: rgba(201,169,110,0.18); border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px rgba(201,169,110,0.12); }

    /* ─── Legend ─────────────────────────────────────────────── */
    .legend {
      display: flex; flex-wrap: wrap; gap: 2rem;
      margin-bottom: 1.1rem; padding: 0.9rem 1.1rem;
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px; align-items: center;
    }
    .legend-group { display: flex; align-items: center; gap: 0.65rem; }
    .legend-label { font-family: 'Cinzel', serif; font-size: 0.74rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text); min-width: 88px; }
    .legend-visual { display: flex; flex-direction: column; gap: 3px; }
    .legend-bar { height: 14px; border-radius: 4px; opacity: 0.9; }
    .legend-bar.resist { width: 220px; background: linear-gradient(to right, rgb(40,200,90), rgb(130,210,160), rgb(80,140,220), rgb(220,140,130), rgb(210,45,45)); }
    .legend-bar.ailm   { width: 160px; background: linear-gradient(to right, #2ecc71, #e0c060, #e74c3c); }
    .legend-ends { display: flex; justify-content: space-between; font-size: 0.66rem; color: var(--muted); font-style: italic; }
    .legend-ends.resist { width: 220px; }
    .legend-ends.ailm   { width: 160px; }

    /* ════════════════════════════════════════════════════════════
       TABLE
       ════════════════════════════════════════════════════════════ */
    .table-scroll {
      overflow-x: auto;
      overflow-y: visible;   /* must NOT be hidden/auto/scroll — that would create a new
                                scroll container on Y and break position:sticky on th     */
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .table-scroll.simplified { overflow-x: hidden; }

    .boss-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }
    .boss-table.detailed   { min-width: 860px; }
    .boss-table.simplified { table-layout: fixed; min-width: unset; }

    /* ── Sticky thead ───────────────────────────────────────── */
    /*
     * WHY th, NOT thead:
     * .table-scroll has overflow-x:auto which creates a scroll
     * container.  position:sticky on thead is relative to that
     * container, so it never escapes it to stick to the viewport.
     * Applying sticky directly to each <th> works correctly:
     * browsers honour per-cell sticky inside overflow scroll
     * containers and pin them to the viewport on the Y axis while
     * still allowing horizontal scroll on the X axis.
     *
     * top values are set by JS (initStickyHeaders) once the first
     * row's rendered height is known, then kept live via
     * ResizeObserver so they update on window resize or mode
     * switch without any layout thrashing.
     */
    .boss-table thead tr th {
      position: sticky;
      /* top is overridden per-row by JS; these are safe defaults */
      top: 0;
      z-index: 10;
    }

    /* Opaque backgrounds — mandatory so body rows don't show
       through the pinned cells.                                  */
    .boss-table thead tr.col-group th              { background: #181b22; }
    .boss-table thead tr.col-group th.group-resist { background: #1a1e28; }
    .boss-table thead tr.col-group th.group-ailm   { background: #1c1b22; }
    .boss-table thead tr.col-names th              { background: #181b22; }
    .boss-table thead tr.col-names th.resist-col   { background: #191d27; }
    .boss-table thead tr.col-names th.ailm-col     { background: #1b1a24; }

    /* Column group row */
    .boss-table thead tr.col-group th {
      font-family: 'Cinzel', serif; font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted); padding: 0.5rem 0.5rem 0.28rem; border-bottom: 1px solid var(--border); text-align: center;
    }
    .boss-table thead tr.col-group th.group-resist {
      border-left: 2px solid rgba(123,159,199,0.2); border-right: 2px solid rgba(123,159,199,0.2); color: var(--accent2);
    }
    .boss-table thead tr.col-group th.group-ailm {
      border-left: 2px solid rgba(201,169,110,0.2); border-right: 2px solid rgba(201,169,110,0.2); color: var(--accent);
    }

    /* Column name row */
    .boss-table thead tr.col-names th {
      font-family: 'Cinzel', serif; font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); padding: 0.38rem 0.38rem; border-bottom: 2px solid var(--border);
      white-space: nowrap; text-align: center; user-select: none;
      /* shadow visible only on the bottom edge of the second row */
      box-shadow: 0 3px 10px rgba(0,0,0,0.6);
    }
    .boss-table thead tr.col-names th.boss-col  { text-align: left; padding-left: 0.7rem; }

    /* Sortable */
    .boss-table thead tr.col-names th.sortable { cursor: pointer; transition: color 0.14s, background 0.14s; }
    .boss-table thead tr.col-names th.sortable:hover { color: var(--text); }
    .boss-table thead tr.col-names th.sort-active { color: var(--accent) !important; }
    .sort-indicator { display: inline-block; margin-left: 2px; font-size: 0.62rem; }

    /* Night separator rows */
    .night-separator td {
      padding: 0.42rem 0.8rem;
      font-family: 'Cinzel', serif; font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase;
      background: var(--surface2); border-top: 3px solid var(--border); border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .night-separator.n1 td { color: #7ec8a0; border-top-color: rgba(126,200,160,0.4); }
    .night-separator.n2 td { color: #7bafd4; border-top-color: rgba(123,175,212,0.4); }
    .night-separator.n3 td { color: var(--accent); border-top-color: rgba(201,169,110,0.4); }

    /* Collapse chevron — lives inside .sep-inner via ::after */
    .sep-inner {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .sep-inner::after {
      content: '▾';
      font-size: 0.75rem;
      opacity: 0.7;
      transition: transform 0.2s ease, opacity 0.2s ease;
      display: inline-block;
    }
    .night-separator.collapsed .sep-inner::after {
      transform: rotate(-90deg);
      opacity: 0.45;
    }

    /* Rows that belong to a collapsed section are hidden.
       We toggle .section-hidden on each boss-row via JS.     */
    .boss-table tbody tr.section-hidden {
      display: none;
    }

    /* Night 3 separator with banner background (overview only) */
    .night-separator.n3.has-banner td {
      position: relative;
      background-size: cover;
      background-position: center 30%;
      background-repeat: no-repeat;
    }
    .night-separator.n3.has-banner td::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(11,12,16,0.72);
    }
    .night-separator.n3.has-banner td > * {
      position: relative;
      z-index: 1;
    }
    /* When banner is set via inline style the text rides above the overlay */
    .night-separator.n3.has-banner td .sep-inner {
      position: relative;
      z-index: 1;
    }

    /* Boss rows */
    .boss-table tbody tr.boss-row { border-bottom: 1px solid rgba(42,45,56,0.7); transition: background 0.12s; }
    .boss-table tbody tr.boss-row:hover { background: rgba(255,255,255,0.025); }

    .boss-table tbody td.boss-key-cell {
      font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.04em; text-transform: capitalize;
      color: var(--accent2); padding: 0.48rem 0.5rem 0.48rem 0.7rem; vertical-align: middle; white-space: nowrap;
    }
    .boss-table tbody td.phase-name-cell {
      font-family: 'Crimson Pro', serif; font-size: 0.8rem; font-style: italic;
      color: var(--muted); padding: 0.48rem 0.45rem; white-space: nowrap;
    }

    /* Stat cells — detailed */
    .boss-table tbody td.stat-cell {
      text-align: center; padding: 0.42rem 0.32rem;
      font-family: 'Crimson Pro', serif; font-size: 0.86rem; font-weight: 600; white-space: nowrap;
    }
    .boss-table tbody td.stat-cell.resist-col { background: rgba(123,159,199,0.022); }
    .boss-table tbody td.stat-cell.ailm-col   { background: rgba(201,169,110,0.022); }
    .boss-table tbody td.stat-cell.immune { color: rgba(110,114,128,0.45); font-size: 0.68rem; font-style: italic; font-weight: 400; }

    /* ── Simplified mode stat cells ─────────────────────────── */
    .boss-table.simplified tbody td.stat-cell {
      padding: 0;
      /* cell height scales: use vw units capped with clamp */
      height: clamp(22px, 2.8vw, 36px);
      font-size: 0 !important;
      border: 1px solid rgba(255,255,255,0.07);
    }
    .boss-table.simplified tbody td.stat-cell.immune {
      background: rgba(255,255,255,0.03) !important;
      border-color: rgba(255,255,255,0.05);
    }

    /* ── Simplified: icon in stat header ────────────────────── */
    /* In simplified view we show an icon instead of text label.
       The icon is placed via JS; we just size it here.         */
    .boss-table.simplified thead tr.col-names th .stat-icon {
      display: block;
      width:  clamp(16px, 2.2vw, 28px);
      height: clamp(16px, 2.2vw, 28px);
      object-fit: contain;
      margin: 0 auto;
      /* slight brightness boost – these icons are often dark */
      filter: brightness(1.15) contrast(1.05);
    }
    /* Fallback text when icon absent/failed */
    .boss-table.simplified thead tr.col-names th {
      font-size: 0.5rem; padding: 0.28rem 0.18rem; letter-spacing: 0.04em;
      white-space: normal; word-break: break-all; line-height: 1.2;
    }
    .boss-table.simplified thead tr.col-group th {
      font-size: 0.52rem; padding: 0.5rem 0.18rem;
    }

    /* ── Simplified: boss icon in boss-key-cell ─────────────── */
    .boss-table.simplified tbody td.boss-key-cell {
      font-size: 0.62rem; padding: 0.3rem 0.4rem;
      white-space: normal; word-break: break-word;
      vertical-align: middle; text-align: center;
    }
    .boss-table.simplified tbody td.phase-name-cell {
      display: none; /* phases hidden in simplified – boss name cell spans */
    }
    /* Boss icon img inside cell */
    .boss-icon-img {
      display: block;
      width:  clamp(28px, 3.5vw, 48px);
      height: clamp(28px, 3.5vw, 48px);
      object-fit: contain;
      margin: 0 auto 2px;
    }

    /* ── Tooltip ─────────────────────────────────────────────── */
    [data-tooltip] { position: relative; cursor: default; }
    [data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(11,12,16,0.95);
      color: var(--text);
      font-family: 'Cinzel', serif;
      font-size: 0.62rem;
      letter-spacing: 0.06em;
      text-transform: capitalize;
      white-space: pre;        /* honours \n characters from the data attribute */
      text-align: left;
      padding: 0.3rem 0.55rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      pointer-events: none;
      z-index: 100;
    }

    /* ─── Filter panel ───────────────────────────────────────── */
    .filter-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.2rem 1.4rem; margin-bottom: 1.6rem; }
    .filter-panel h3 { font-family: 'Cinzel', serif; font-size: 0.78rem; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 0.9rem; text-transform: uppercase; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 1.4rem; }
    .filter-group { flex: 1; min-width: 190px; }
    .section-label { font-family: 'Cinzel', serif; font-size: 0.66rem; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.45rem; }
    .filter-group select {
      width: 100%; padding: 0.5rem 0.85rem;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-family: 'Crimson Pro', serif; font-size: 0.92rem;
      outline: none; cursor: pointer; transition: border-color 0.18s;
    }
    .filter-group select:focus { border-color: var(--accent); }

    /* ─── Overview bar ───────────────────────────────────────── */
    .overview-bar { display: flex; flex-wrap: wrap; gap: 0.9rem; align-items: center; margin-bottom: 1.3rem; }
    .overview-bar label { font-family: 'Cinzel', serif; font-size: 0.63rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    .overview-bar select { padding: 0.42rem 0.75rem; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: 'Crimson Pro', serif; font-size: 0.88rem; outline: none; cursor: pointer; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <h1>nightreign bosses weakness</h1>
  <p>Resistances and ailments</p>
  <div class="header-controls">
    <nav class="tabs">
      <button class="tab-btn active" data-tab="expedition">Expedition View</button>
      <button class="tab-btn" data-tab="night3filter">Night 3 Filter</button>
      <button class="tab-btn" data-tab="overview">All Night 3 Bosses</button>
    </nav>
    <div class="seg-wrap">
      <span class="seg-label">View</span>
      <div class="segmented" id="global-toggle">
        <button class="seg-btn" data-mode="detailed">Detailed</button>
        <button class="seg-btn active" data-mode="simplified">Simplified</button>
      </div>
    </div>
  </div>
</header>

<main>

  <!-- ═══════════ EXPEDITION PANEL ═══════════ -->
  <div class="panel active" id="panel-expedition">
    <div class="exp-btn-section">
      <p class="exp-btn-label">Select Expedition</p>
      <div class="exp-btn-grid" id="exp-btn-grid"></div>
    </div>
    <div id="expedition-display">
      <div class="empty-state">
        <div class="icon">⚔️</div>
        <p>Select an expedition above to view its bosses</p>
      </div>
    </div>
  </div>

  <!-- ═══════════ NIGHT 3 FILTER PANEL ═══════════ -->
  <div class="panel" id="panel-night3filter">
    <div class="filter-panel">
      <h3>🔍 Filter Night 3 Bosses by Night 1 / Night 2</h3>
      <div class="filter-row">
        <div class="filter-group">
          <p class="section-label">Night 1 Boss</p>
          <select id="filter-n1"><option value="">— Any Night 1 boss —</option></select>
        </div>
        <div class="filter-group">
          <p class="section-label">Night 2 Boss</p>
          <select id="filter-n2"><option value="">— Any Night 2 boss —</option></select>
        </div>
      </div>
    </div>
    <div id="night3-results">
      <div class="empty-state">
        <div class="icon">🌙</div>
        <p>Select a Night 1 or Night 2 boss to try and guess the nightlord</p>
      </div>
    </div>
  </div>

  <!-- ═══════════ OVERVIEW PANEL ═══════════ -->
  <div class="panel" id="panel-overview">
    <div class="overview-bar">
      <label>Filter expedition:</label>
      <select id="overview-exp-filter"><option value="">All Expeditions</option></select>
    </div>
    <div id="overview-content"></div>
  </div>

</main>

<script>
// ════════════════════════════════════════════════════════════════

let DATA = null;
try {
  DATA = JSON.parse(RAW_JSON.replace(/,(\s*[}\]])/g, '$1'));
} catch (e) {
  document.body.innerHTML = `<div style="padding:2rem;color:#c94040;font-family:monospace"><h2>JSON parse error</h2><pre>${e.message}</pre></div>`;
  throw e;
}

const BOSSES      = DATA.bosses;
const EXPEDITIONS = DATA.expedition;
const ICONS       = DATA.icon ?? {};  // stat-name → icon URL map

const PCT_STATS  = ['physical','slash','strike','pierce','magic','fire','lightning','holy'];
const AILM_STATS = ['poison','rot','bleed','frostbite','sleep','madness'];
const ALL_STATS  = [...PCT_STATS, ...AILM_STATS];

// ── Extract boss meta (icon / banner) — last entry without a "name" key ──
function bossMeta(bossKey) {
  const entries = BOSSES[bossKey];
  if (!entries) return {};
  return entries.find(e => !('name' in e)) ?? {};
}

// ── Phase entries only (entries with a "name" key) ────────────
function bossPhases(bossKey) {
  const entries = BOSSES[bossKey];
  if (!entries) return [];
  return entries.filter(e => 'name' in e);
}

// ─── Color helpers ────────────────────────────────────────────
const PCT_NEG_CAP = -30, PCT_POS_CAP = 30;

function pctColor(rawStr) {
  const val = parseInt(rawStr.replace('%', ''), 10);
  if (val === 0) return 'rgb(80,140,220)';
  if (val < 0) {
    const t = Math.min(1, val / PCT_NEG_CAP);
    return `rgb(${Math.round(130-t*90)},${Math.round(210-t*10)},${Math.round(160-t*70)})`;
  }
  const t = Math.min(1, val / PCT_POS_CAP);
  return `rgb(${Math.round(220-t*10)},${Math.round(140-t*95)},${Math.round(130-t*85)})`;
}

const AILM_MIN = 63, AILM_CAP = 542;
function ailmColor(val) {
  const t = Math.max(0, Math.min(1, (val - AILM_MIN) / (AILM_CAP - AILM_MIN)));
  if (t < 0.5) { const s = t*2; return `rgb(${Math.round(s*220)},${Math.round(185-s*20)},0)`; }
  const s = (t-0.5)*2;
  return `rgb(220,${Math.round(165-s*115)},0)`;
}

function cap(s) { return String(s).split(' ').map(w => w[0]?.toUpperCase()+w.slice(1)).join(' '); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ─── Sort helpers ─────────────────────────────────────────────
function statSortVal(bossKey, stat) {
  const phases = bossPhases(bossKey);
  if (!phases.length) return PCT_STATS.includes(stat) ? -Infinity : Infinity;
  const phase = phases[0];
  if (PCT_STATS.includes(stat)) return parseInt((phase[stat] ?? '0%').replace('%',''), 10);
  const v = phase[stat];
  return v === null || v === undefined ? Infinity : v;
}

function sortBossKeys(bossKeys, sortState) {
  if (!sortState?.col) return [...bossKeys];
  const { col, dir } = sortState;
  return [...bossKeys].sort((a, b) => {
    const va = statSortVal(a, col), vb = statSortVal(b, col);
    return dir === 'asc' ? va - vb : vb - va;
  });
}

// ════════════════════════════════════════════════════════════════
// GLOBAL STATE
// ════════════════════════════════════════════════════════════════
let globalMode = 'simplified';

const sortStates = {
  expedition:   { col: null, dir: null },
  night3filter: { col: null, dir: null },
  overview:     { col: null, dir: null },
};

// Track which stat icons have previously failed to load
const iconLoadFailed = new Set();

// ════════════════════════════════════════════════════════════════
// LEGEND
// ════════════════════════════════════════════════════════════════
function buildLegend() {
  return `<div class="legend">
    <div class="legend-group">
      <span class="legend-label">Resistances</span>
      <div class="legend-visual">
        <div class="legend-bar resist"></div>
        <div class="legend-ends resist"><span>≤−30% weak</span><span>0% = neutral</span><span>≥+30% resist</span></div>
      </div>
    </div>
    <div class="legend-group">
      <span class="legend-label">Ailments</span>
      <div class="legend-visual">
        <div class="legend-bar ailm"></div>
        <div class="legend-ends ailm"><span>Procs easily</span><span>Very resistant</span></div>
      </div>
    </div>
  </div>`;
}

// ════════════════════════════════════════════════════════════════
// TABLE BUILDER
// ════════════════════════════════════════════════════════════════

// Build a stat header cell — in simplified mode shows icon if available
function statThHtml(stat, cls, sortable, sortState) {
  const simp     = globalMode === 'simplified';
  const isActive = sortState?.col === stat;
  const sortCls  = sortable ? ` sortable${isActive ? ' sort-active' : ''}` : '';
  const dataAttr = sortable ? ` data-sort="${stat}"` : '';
  const indic    = sortable && isActive
    ? `<span class="sort-indicator">${sortState.dir === 'asc' ? '↑' : '↓'}</span>` : '';

  let inner;
  if (simp && ICONS[stat] && !iconLoadFailed.has(stat)) {
    // Icon element; onerror flips to text via a helper we attach post-render
    inner = `<img class="stat-icon" src="${esc(ICONS[stat])}" alt="${esc(cap(stat))}"
               data-stat="${stat}"
               onerror="handleStatIconError(this)"
             />${indic}`;
  } else {
    inner = cap(stat) + indic;
  }

  return `<th class="${cls}${sortCls}" data-sort="${stat}"
              data-tooltip="${esc(cap(stat))}"
              ${dataAttr}>${inner}</th>`;
}

function buildTable(nightGroups, { mode, panelId, sortState }) {
  const simp      = mode === 'simplified';
  const totalCols = 2 + PCT_STATS.length + AILM_STATS.length;
  const nightCls  = ['n1','n2','n3'];
  const nightCol  = ['#7ec8a0','#7bafd4','#c9a96e'];

  // ── Header ──────────────────────────────────────────────────
  const groupRow = `<tr class="col-group">
    <th colspan="2"></th>
    <th colspan="${PCT_STATS.length}" class="group-resist">Resistances / Weaknesses</th>
    <th colspan="${AILM_STATS.length}" class="group-ailm">Ailment Thresholds</th>
  </tr>`;

  function indic(stat) {
    if (!sortState?.col || sortState.col !== stat) return '';
    return `<span class="sort-indicator">${sortState.dir === 'asc' ? '↑' : '↓'}</span>`;
  }

  // Boss column header(s)
  const bossColHdr = simp
    ? `<th class="boss-col sortable${sortState?.col==='__boss'?' sort-active':''}" data-sort="__boss" colspan="2"
          style="text-align:center;cursor:pointer">Boss${indic('__boss')}</th>`
    : `<th class="boss-col sortable${sortState?.col==='__boss'?' sort-active':''}" data-sort="__boss"
          style="text-align:left;cursor:pointer">Boss${indic('__boss')}</th>
       <th class="boss-col" style="text-align:left">Phase / Form</th>`;

  const resistHdrs = PCT_STATS.map(s => statThHtml(s, 'resist-col', true, sortState)).join('');
  const ailmHdrs   = AILM_STATS.map(s => statThHtml(s, 'ailm-col',  true, sortState)).join('');
  const namesRow   = `<tr class="col-names">${bossColHdr}${resistHdrs}${ailmHdrs}</tr>`;

  // ── Body ────────────────────────────────────────────────────
  let tbody = '';

  // Section counter for collapsible group linking (unique per table render)
  let sectionIdx = 0;

  for (const group of nightGroups) {
    const nightNum = group.nightNum;
    const cls = nightCls[nightNum-1] ?? 'n1';
    const col = nightCol[nightNum-1] ?? nightCol[0];
    const sectionId = `sec-${panelId}-${sectionIdx++}`;

    // Banner background on Night 3 separator rows whenever a URL is available
    let sepExtra = '';
    let bannerStyle = '';
    if (nightNum === 3 && group.bannerUrl) {
      sepExtra = ' has-banner';
      bannerStyle = ` style="background-image:url('${esc(group.bannerUrl)}')"`;
    }

    // Night separator — clickable; data-section links it to its body rows
    tbody += `<tr class="night-separator ${cls}${sepExtra}" data-section="${sectionId}">
      <td colspan="${totalCols}"${bannerStyle}>
        <span class="sep-inner" style="color:${col}">${group.label ?? `Night ${group.nightNum}`}</span>
      </td>
    </tr>`;

    for (const bossKey of group.bossKeys) {
      const phases = bossPhases(bossKey);
      const meta   = bossMeta(bossKey);

      if (!phases.length) {
        tbody += `<tr class="boss-row" data-section-member="${sectionId}">
          <td class="boss-key-cell">${cap(bossKey)}</td>
          ${!simp ? `<td class="phase-name-cell" style="color:var(--muted)">No data</td>` : ''}
          ${PCT_STATS.map(() => `<td class="stat-cell resist-col">—</td>`).join('')}
          ${AILM_STATS.map(() => `<td class="stat-cell ailm-col">—</td>`).join('')}
        </tr>`;
        continue;
      }

      const rowspan = phases.length;

      phases.forEach((phase, pi) => {
        // ── Lead cells ──────────────────────────────────────────
        let lead;
        if (simp) {
          if (pi === 0) {
            // In simplified: single cell spanning all phases, shows icon or name.
            // Tooltip shows all phase names (from the JSON "name" field).
            const phaseNames = phases.map(p => cap(p.name || '')).filter(Boolean).join('\n');
            const tooltipText = phaseNames || cap(bossKey);
            let bossLabel;
            if (meta.icon && !iconLoadFailed.has(`boss:${bossKey}`)) {
              bossLabel = `<img class="boss-icon-img" src="${esc(meta.icon)}"
                             alt="${esc(cap(bossKey))}"
                             data-boss="${esc(bossKey)}"
                             onerror="handleBossIconError(this)"
                           />`;
            } else {
              bossLabel = cap(bossKey);
            }
            lead = `<td class="boss-key-cell" colspan="2" rowspan="${rowspan}"
                        data-tooltip="${esc(tooltipText)}">${bossLabel}</td>`;
          } else {
            lead = ''; // rowspan covers it
          }
        } else {
          // Detailed: boss name + phase name as separate cells
          lead = (pi === 0
            ? `<td class="boss-key-cell" rowspan="${rowspan}">${cap(bossKey)}</td>`
            : '')
            + `<td class="phase-name-cell">${phase.name ? cap(phase.name) : `Phase ${pi+1}`}</td>`;
        }

        // ── Stat cells ───────────────────────────────────────────
        const resistCells = PCT_STATS.map(stat => {
          const raw   = phase[stat] ?? '0%';
          const color = pctColor(raw);
          return simp
            ? `<td class="stat-cell resist-col" style="background-color:${color};opacity:0.85"></td>`
            : `<td class="stat-cell resist-col" style="color:${color}">${raw}</td>`;
        }).join('');

        const ailmCells = AILM_STATS.map(stat => {
          const val = phase[stat];
          if (val === null || val === undefined)
            return `<td class="stat-cell ailm-col immune"></td>`;
          const color = ailmColor(val);
          return simp
            ? `<td class="stat-cell ailm-col" style="background-color:${color};opacity:0.85"></td>`
            : `<td class="stat-cell ailm-col" style="color:${color}">${val}</td>`;
        }).join('');

        tbody += `<tr class="boss-row" data-section-member="${sectionId}">${lead}${resistCells}${ailmCells}</tr>`;
      });
    }
  }

  const tableClass  = `boss-table ${mode}`;
  const scrollClass = `table-scroll${simp ? ' simplified' : ''}`;

  return `<div class="${scrollClass}">
    <table class="${tableClass}" id="tbl-${panelId}">
      <thead>${groupRow}${namesRow}</thead>
      <tbody>${tbody}</tbody>
    </table>
  </div>`;
}

// ── Icon error handlers (called by onerror attributes) ────────
function handleStatIconError(img) {
  const stat = img.dataset.stat;
  iconLoadFailed.add(stat);
  // Replace with text label
  const th = img.closest('th');
  if (th) {
    // Keep any sort indicator
    const indic = th.querySelector('.sort-indicator');
    th.textContent = cap(stat);
    if (indic) th.appendChild(indic);
  }
}

function handleBossIconError(img) {
  const bossKey = img.dataset.boss;
  iconLoadFailed.add(`boss:${bossKey}`);
  const td = img.closest('td');
  if (td) td.textContent = cap(bossKey);
}

// ── Attach sort click listeners ───────────────────────────────
function attachSortListeners(containerId, panelId, onSort) {
  const el = document.getElementById(containerId)
           ?? document.querySelector(`#panel-${panelId}`);
  if (!el) return;
  el.querySelectorAll('th.sortable[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.sort;
      const st  = sortStates[panelId];
      if (st.col === col) {
        st.dir = st.dir === 'asc' ? 'desc' : null;
        if (!st.dir) st.col = null;
      } else {
        st.col = col; st.dir = 'asc';
      }
      onSort();
    });
  });
}

// ── Attach collapsible section toggles ────────────────────────
// Each .night-separator[data-section] is the toggle header.
// Clicking it hides/shows all sibling tr[data-section-member]
// with the matching section id. Works on any table, any panel.
function attachCollapsibleSections(container) {
  const el = typeof container === 'string'
    ? document.getElementById(container)
    : container;
  if (!el) return;

  el.querySelectorAll('.night-separator[data-section]').forEach(sepRow => {
    sepRow.addEventListener('click', () => {
      const id = sepRow.dataset.section;
      const isCollapsed = sepRow.classList.toggle('collapsed');
      // Find all rows belonging to this section within the same table
      const table = sepRow.closest('table');
      if (!table) return;
      table.querySelectorAll(`tr[data-section-member="${id}"]`).forEach(row => {
        row.classList.toggle('section-hidden', isCollapsed);
      });
    });
  });
}

// ════════════════════════════════════════════════════════════════
// EXPEDITION PANEL
// ════════════════════════════════════════════════════════════════
const expBtnGrid = document.getElementById('exp-btn-grid');
const expDisplay = document.getElementById('expedition-display');
const expNames   = Object.keys(EXPEDITIONS);
let   selectedExp = null;

expNames.forEach(name => {
  const btn = document.createElement('button');
  btn.className   = 'exp-btn';
  btn.textContent = cap(name);
  btn.dataset.name = name;
  btn.addEventListener('click', () => selectExpedition(name));
  expBtnGrid.appendChild(btn);
});

function selectExpedition(name) {
  selectedExp = name;
  expBtnGrid.querySelectorAll('.exp-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.name === name));
  renderExpedition();
}

function renderExpedition() {
  if (!selectedExp) return;
  const exp = EXPEDITIONS[selectedExp];
  if (!exp) { expDisplay.innerHTML = `<div class="empty-state"><p>No data.</p></div>`; return; }

  const st = sortStates.expedition;
  const n3keys = sortBossKeys(exp['third night'] ?? [], st);
  const nightGroups = [
    { nightNum:1, label:'🌑 Night 1', bossKeys: sortBossKeys(exp['first night']  ?? [], st) },
    { nightNum:2, label:'🌒 Night 2', bossKeys: sortBossKeys(exp['second night'] ?? [], st) },
    { nightNum:3, label:'🌕 Night 3', bossKeys: n3keys,
      bannerUrl: n3keys.length === 1 ? (bossMeta(n3keys[0]).banner ?? null) : null },
  ];

  expDisplay.innerHTML = buildLegend() + buildTable(nightGroups, {
    mode: globalMode, panelId: 'expedition', sortState: st
  });
  attachSortListeners('expedition-display', 'expedition', renderExpedition);
  attachCollapsibleSections('expedition-display');
}

// ════════════════════════════════════════════════════════════════
// NIGHT 3 FILTER PANEL
// ════════════════════════════════════════════════════════════════
const filterN1      = document.getElementById('filter-n1');
const filterN2      = document.getElementById('filter-n2');
const night3Results = document.getElementById('night3-results');

const allN1 = new Set(), allN2 = new Set();
for (const exp of Object.values(EXPEDITIONS)) {
  (exp['first night']  ?? []).forEach(b => allN1.add(b));
  (exp['second night'] ?? []).forEach(b => allN2.add(b));
}
[...allN1].sort().forEach(b => filterN1.innerHTML += `<option value="${b}">${cap(b)}</option>`);
[...allN2].sort().forEach(b => filterN2.innerHTML += `<option value="${b}">${cap(b)}</option>`);

function renderN3Filter() {
  const n1sel = filterN1.value, n2sel = filterN2.value;
  if (!n1sel && !n2sel) {
    night3Results.innerHTML = `<div class="empty-state"><div class="icon">🌙</div><p>Select a Night 1 or Night 2 boss to try and guess the nightlord</p></div>`;
    return;
  }

  const matchedN3 = new Map();
  for (const [expName, exp] of Object.entries(EXPEDITIONS)) {
    const n1ok = !n1sel || (exp['first night']  ?? []).includes(n1sel);
    const n2ok = !n2sel || (exp['second night'] ?? []).includes(n2sel);
    if (n1ok && n2ok) {
      for (const boss of (exp['third night'] ?? [])) {
        if (!matchedN3.has(boss)) matchedN3.set(boss, []);
        matchedN3.get(boss).push(expName);
      }
    }
  }

  if (!matchedN3.size) {
    night3Results.innerHTML = `<div class="empty-state"><p>No Night 3 bosses match.</p></div>`;
    return;
  }

  const st       = sortStates.night3filter;
  let bossList   = sortBossKeys([...matchedN3.keys()], st);
  const nightGroups = bossList.map(bossKey => ({
    nightNum: 3,
    label: `🌕 ${cap(bossKey)} — from: ${matchedN3.get(bossKey).map(cap).join(', ')}`,
    bossKeys: [bossKey],
    bannerUrl: bossMeta(bossKey).banner ?? null,
  }));

  night3Results.innerHTML = buildLegend() + buildTable(nightGroups, {
    mode: globalMode, panelId: 'night3filter', sortState: st
  });
  attachSortListeners('night3-results', 'night3filter', renderN3Filter);
  attachCollapsibleSections('night3-results');
}

filterN1.addEventListener('change', renderN3Filter);
filterN2.addEventListener('change', renderN3Filter);

// ════════════════════════════════════════════════════════════════
// OVERVIEW PANEL
// ════════════════════════════════════════════════════════════════
const overviewContent   = document.getElementById('overview-content');
const overviewExpFilter = document.getElementById('overview-exp-filter');
let   overviewRendered  = false;

expNames.slice().sort().forEach(n =>
  overviewExpFilter.innerHTML += `<option value="${n}">${cap(n)}</option>`);

function renderOverview() {
  const expFilter = overviewExpFilter.value;

  let entries = Object.entries(EXPEDITIONS);
  if (expFilter) entries = entries.filter(([k]) => k === expFilter);

  const items = entries
    .map(([expName, exp]) => ({ expName, n3bosses: exp['third night'] ?? [] }))
    .filter(i => i.n3bosses.length);

  if (!items.length) {
    overviewContent.innerHTML = `<div class="empty-state"><p>No results.</p></div>`;
    return;
  }

  const st = sortStates.overview;

  let flat = [];
  for (const { expName, n3bosses } of items) {
    for (const boss of n3bosses) flat.push({ expName, boss });
  }

  // Sort preserving expName association
  if (st.col) {
    flat.sort((a, b) => {
      const va = statSortVal(a.boss, st.col), vb = statSortVal(b.boss, st.col);
      return st.dir === 'asc' ? va - vb : vb - va;
    });
  }

  const nightGroups = flat.map(({ expName, boss }) => {
    const meta = bossMeta(boss);
    return {
      nightNum:  3,
      label:     `🌕 ${cap(boss)} — ${cap(expName)}`,
      bossKeys:  [boss],
      bannerUrl: meta.banner ?? null,
    };
  });

  overviewContent.innerHTML = buildLegend() + buildTable(nightGroups, {
    mode: globalMode, panelId: 'overview', sortState: st
  });
  attachSortListeners('overview-content', 'overview', renderOverview);
  attachCollapsibleSections('overview-content');
}

overviewExpFilter.addEventListener('change', renderOverview);

// ════════════════════════════════════════════════════════════════
// GLOBAL VIEW TOGGLE
// ════════════════════════════════════════════════════════════════
document.getElementById('global-toggle').addEventListener('click', e => {
  const btn = e.target.closest('.seg-btn[data-mode]');
  if (!btn) return;
  const mode = btn.dataset.mode;
  if (mode === globalMode) return;
  globalMode = mode;

  document.querySelectorAll('#global-toggle .seg-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === mode));

  if (selectedExp) renderExpedition();
  if (filterN1.value || filterN2.value) renderN3Filter();
  if (overviewRendered) renderOverview();
});

// ════════════════════════════════════════════════════════════════
// TABS
// ════════════════════════════════════════════════════════════════
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'overview' && !overviewRendered) {
      overviewRendered = true;
      renderOverview();
    }
  });
});

// ════════════════════════════════════════════════════════════════
// STICKY HEADERS
//
// Problem: position:sticky on <thead> does not work when an
// ancestor has overflow:auto/hidden, because sticky positioning
// is relative to the nearest scroll ancestor, not the viewport.
// .table-scroll has overflow-x:auto, so sticky on thead is
// trapped inside it and never pins to the viewport.
//
// Solution: position:sticky is set via CSS on each individual
// <th> (not thead). Browsers handle per-cell sticky correctly
// inside a horizontal-scroll container: the cell pins on the
// Y axis to the viewport while horizontal scroll is unaffected.
//
// We must supply the correct `top` offset per thead row:
//   col-group row  → top = 0
//   col-names row  → top = rendered height of the col-group row
//
// initStickyHeaders() measures and applies these offsets. It is
// called via MutationObserver after every innerHTML write (which
// covers all three panels and view-mode switches) and also via
// ResizeObserver on <html> so rem/vw-based row heights stay
// correct after window resize.
// ════════════════════════════════════════════════════════════════
function initStickyHeaders() {
  document.querySelectorAll('.boss-table').forEach(table => {
    let cumulativeTop = 0;
    table.querySelectorAll('thead tr').forEach(row => {
      row.querySelectorAll('th').forEach(th => {
        th.style.top = cumulativeTop + 'px';
      });
      cumulativeTop += row.getBoundingClientRect().height;
    });
  });
}

// Observe every panel container; fire after innerHTML is replaced.
(function wireSticky() {
  const containers = document.querySelectorAll(
    '#expedition-display, #night3-results, #overview-content'
  );
  const mo = new MutationObserver(() => {
    // rAF: measure after the browser has laid out the new nodes
    requestAnimationFrame(initStickyHeaders);
  });
  containers.forEach(c => mo.observe(c, { childList: true, subtree: true }));

  // Also re-run on window resize (rem / vw units change row heights)
  new ResizeObserver(() => {
    requestAnimationFrame(initStickyHeaders);
  }).observe(document.documentElement);
})();
</script>
